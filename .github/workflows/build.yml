name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          
          export ANDROID_NDK="$SDK_ROOT/ndk/29.0.14206865"
          export ANDROID_NDK_HOME="$ANDROID_NDK"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK" >> "$GITHUB_ENV"

          sdkmanager --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "cmake;3.22.1" \
            "ndk;29.0.14206865"

      - name: Restore CCache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-v3-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-v3-

      - name: Prepare native dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y ccache

          export PATH="/usr/lib/ccache:$PATH"
          echo "PATH=/usr/lib/ccache:$PATH" >> "$GITHUB_ENV"
          ccache --max-size=2G
          ccache -z

          git -C external/fex submodule update --init --recursive \
            External/fmt External/range-v3 External/rpmalloc \
            External/unordered_dense External/xxhash Source/Common/cpp-optparse

          DEPS="$GITHUB_WORKSPACE/native-deps"
          mkdir -p "$DEPS/root/subprojects"

          clone_tag() {
            local url="$1"
            local ref="$2"
            local destination="$3"
            git clone --depth 1 --branch "$ref" --recurse-submodules "$url" "$destination"
          }

          clone_tag https://github.com/zeux/volk.git 1.4.304 "$DEPS/volk"
          clone_tag https://github.com/KhronosGroup/glslang.git 16.1.0 "$DEPS/glslang"
          clone_tag https://github.com/KhronosGroup/SPIRV-Reflect.git vulkan-sdk-1.4.328.0 "$DEPS/spirv_reflect"
          clone_tag https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator.git v3.3.0 "$DEPS/vma"
          clone_tag https://github.com/libsdl-org/SDL.git release-3.4.18 "$DEPS/SDL3"

          git clone --filter=blob:none --recurse-submodules \
            https://github.com/bylaws/libadrenotools.git "$DEPS/adrenotools"
          git -C "$DEPS/adrenotools" checkout --detach 8fae8ce
          git -C "$DEPS/adrenotools" submodule update --init --recursive
          git -C "$DEPS/adrenotools" apply \
            "$GITHUB_WORKSPACE/tools/native/adrenotools-kgsl-context-priority.patch"

          git clone --filter=blob:none \
            https://gitlab.freedesktop.org/slirp/libslirp.git "$DEPS/libslirp"
          git -C "$DEPS/libslirp" checkout --detach 26be815b

          NV2A_DIR="$DEPS/root/subprojects/nv2a_vsh_cpu"
          mkdir -p "$NV2A_DIR"
          curl --fail --location --retry 3 --retry-delay 2 --silent --show-error \
            "https://codeload.github.com/xemu-project/nv2a_vsh_cpu/tar.gz/561fe80da57a881f89000256b459440c0178a7ce" \
            | tar -xz --strip-components=1 -C "$NV2A_DIR"

      - name: Build native core and copy libs
        shell: bash
        run: |
          set -euo pipefail
          NDK_CMAKE="$ANDROID_NDK/build/cmake/android.toolchain.cmake"

          cmake -S native -B build/native/core -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_CMAKE" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DNC_DEPS="$GITHUB_WORKSPACE/native-deps" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON

          ninja -C build/native/core hakuxcore
          ccache -s || true
          bash tools/native/app-libs.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          validate-wrappers: false

      - name: Build signed APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          keytool -genkeypair -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "storeFile=debug.keystore" > key.properties
          echo "storePassword=android" >> key.properties
          echo "keyAlias=androiddebugkey" >> key.properties
          echo "keyPassword=android" >> key.properties
          sed -i '/^[[:space:]]*org\.gradle\.java\.home[[:space:]]*=/d' gradle.properties
          ./gradlew assembleRelease --no-daemon
          "$ANDROID_SDK_ROOT/build-tools/36.1.0/apksigner" verify --verbose \
            app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hakuX-release-apk
          path: |
            android/app/build/outputs/apk/release/*.apk